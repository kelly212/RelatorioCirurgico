<!DOCTYPE html>
<html lang="pt-BR">
<head>
			<meta charset="UTF-8">
			<title>Login</title>
			
			<style>
						* { box-sizing: border-box; }
						
						body {
									margin: 0;
									height: 100vh;
									background: radial-gradient(circle at top, #3c3f41, #000000);
									display: flex;
									align-items: center;
									justify-content: center;
									font-family: Arial, sans-serif;
						}
						
						.card {
									width: 360px;
									padding: 30px 25px;
									border-radius: 24px;
									background: linear-gradient(
											145deg,
											rgba(0, 0, 0, 0.5),
											rgba(43, 45, 48, 0.5)
									);
									backdrop-filter: blur(15px);
									box-shadow:
											0 0 2px rgba(38, 40, 46, 0.7),
											inset 0 0 2px rgba(255,255,255,.15);
									color: #fff;
						}
						
						.avatar {
									width: 80px;
									height: 80px;
									margin: 0 auto 25px;
									border-radius: 50%;
									border: 2px solid rgba(255,255,255,.4);
									display: flex;
									align-items: center;
									justify-content: center;
						}
						
						.avatar::before {
									content: "📷";
									font-size: 30px;
						}
						
						.field {
									background: rgba(0,0,0,.25);
									border-radius: 8px;
									display: flex;
									align-items: center;
									padding: 10px;
									margin-bottom: 12px;
						}
						
						.field span {
									margin-right: 8px;
									opacity: .8;
						}
						
						.field input {
									flex: 1;
									background: transparent;
									border: none;
									outline: none;
									color: #fff;
						}
						
						.field input::placeholder {
									color: rgba(255,255,255,.6);
						}
						
						.toggle {
									cursor: pointer;
									font-size: 14px;
						}
						
						.options {
									display: flex;
									justify-content: space-between;
									align-items: center;
									font-size: 12px;
									margin: 10px 0 20px;
						}
						
						.options a {
									color: #7fd3ff;
									text-decoration: none;
						}
						
						button {
									width: 100%;
									padding: 12px;
									border-radius: 10px;
									border: none;
									background: linear-gradient(145deg, #07925d, #11b6aa);
									color: #fff;
									font-weight: bold;
									letter-spacing: 1px;
									cursor: pointer;
									box-shadow: 0 0 15px rgba(113, 113, 113, 0.6);
						}
						
						button:hover {
									opacity: .9;
						}
			</style>
</head>
<body>

<div class="card">
			<!--<div class="field">-->
						<!--<span>👤</span>-->
						<!--<input id="user" placeholder="Email" value="dks.shalon@gmail.com">-->
			<!--</div>-->
			
			<div class="field">
						<span>🔒</span>
						<input id="pass" type="password" placeholder="Password">
						<span class="toggle" onclick="toggle()">👁</span>
			</div>
			
			<button onclick="login()">ENTRAR</button>

</div>



<script>

   function toggle() {
      const p = document.getElementById('pass');
      p.type = p.type === 'password' ? 'text' : 'password';
   }

      // const email = document.getElementById('user').value;
  
      async function hashPassword(password) {
         // Converte a senha para um array de bytes
         const encoder = new TextEncoder();
         const data = encoder.encode(password);

         // Gera o hash SHA-256
         const hashBuffer = await crypto.subtle.digest('SHA-256', data);

         // Converte o hash para string hexadecimal
         const hashArray = Array.from(new Uint8Array(hashBuffer));
         const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

         return hashHex;
      }

   function initializeStorage() {
         sessionStorage.setItem('hash', 'cd07c536b419e7f6da570f08c36cfbc31a795237722bd8e79b4c26e4c77a021d');
   }

   function criarTokenSessao() {
      return crypto.randomUUID();
   }
   
   initializeStorage();
   
   async function login() {
      
      const password = document.getElementById('pass').value;
      console.log(password);
      // Validação básica
      if (!password) {
         alert('Por favor, preencha a senha');
         return;
      }

      
      // Gera o hash da senha
      const hashedPassword = await hashPassword(password);
      const hash = sessionStorage.getItem('hash');

      // Verifica as credenciais
      if (hash === hashedPassword) {
         sessionStorage.setItem("sessionToken", criarTokenSessao());
									window.location.href = 'principal.html';
      } else {
         alert('Senha incorreta');
      }
   }

</script>

</body>
</html>
