<!DOCTYPE html>
<html lang="pt-BR">
<head>
			<meta charset="UTF-8">
			<script src="https://cdn.auth0.com/js/auth0-spa-js/2.0/auth0-spa-js.production.js"></script>
			<title>Login</title>
			
			<style>
						* { box-sizing: border-box; }
						
						body {
									margin: 0;
									height: 100vh;
									background: radial-gradient(circle at top, #0e4c7a, #061e2f);
									display: flex;
									align-items: center;
									justify-content: center;
									font-family: Arial, sans-serif;
						}
						
						.card {
									width: 360px;
									padding: 30px 25px;
									border-radius: 24px;
									background: linear-gradient(
											145deg,
											rgba(0,170,255,0.25),
											rgba(0,80,140,0.25)
									);
									backdrop-filter: blur(15px);
									box-shadow:
											0 0 2px rgba(0,180,255,.7),
											inset 0 0 2px rgba(255,255,255,.15);
									color: #fff;
						}
						
						.avatar {
									width: 80px;
									height: 80px;
									margin: 0 auto 25px;
									border-radius: 50%;
									border: 2px solid rgba(255,255,255,.4);
									display: flex;
									align-items: center;
									justify-content: center;
						}
						
						.avatar::before {
									content: "📷";
									font-size: 30px;
						}
						
						.field {
									background: rgba(0,0,0,.25);
									border-radius: 8px;
									display: flex;
									align-items: center;
									padding: 10px;
									margin-bottom: 12px;
						}
						
						.field span {
									margin-right: 8px;
									opacity: .8;
						}
						
						.field input {
									flex: 1;
									background: transparent;
									border: none;
									outline: none;
									color: #fff;
						}
						
						.field input::placeholder {
									color: rgba(255,255,255,.6);
						}
						
						.toggle {
									cursor: pointer;
									font-size: 14px;
						}
						
						.options {
									display: flex;
									justify-content: space-between;
									align-items: center;
									font-size: 12px;
									margin: 10px 0 20px;
						}
						
						.options a {
									color: #7fd3ff;
									text-decoration: none;
						}
						
						button {
									width: 100%;
									padding: 12px;
									border-radius: 10px;
									border: none;
									background: linear-gradient(145deg,#00b4ff,#0077b6);
									color: #fff;
									font-weight: bold;
									letter-spacing: 1px;
									cursor: pointer;
									box-shadow: 0 0 15px rgba(0,180,255,.6);
						}
						
						button:hover {
									opacity: .9;
						}
			</style>
</head>
<body>

<div class="card">
			<div class="field">
						<span>👤</span>
						<input id="user" placeholder="Email" value="dks.shalon@gmail.com">
			</div>
			
			
			<div class="field">
						<span>🔒</span>
						<input id="pass" type="password" placeholder="Password" value="m@sqZq3UA4LdqJ6">
						<span class="toggle" onclick="toggle()">👁</span>
			</div>
			
			<button onclick="login()">LOGIN</button>
</div>



<script>
  
   function toggle() {
      const p = document.getElementById('pass');
      p.type = p.type === 'password' ? 'text' : 'password';
   }

   // m@sqZq3UA4LdqJ6

   async function login() {
      console.log("login");
      const email = document.getElementById('user').value;
      const senha = document.getElementById('pass').value;

      const res = await fetch('https://shelliack.us.auth0.com/oauth/token', {
         method: 'POST',
         headers: {'Content-Type': 'application/json'},
         body: JSON.stringify({
            grant_type: 'password',
            // grant_type:"client_credentials",
            username: email,
            password: senha,
            client_id: 'OOOS41gjNdG63T1a8h4L91uBJqwxvVEZ',
            audience: 'https://shelliack.us.auth0.com/api/v2/',
            scope: 'openid profile email'
         })
      });

      const data = await res.json();
      console.log(data);

      if (data.access_token) {
         console.log("if");
         sessionStorage.setItem('token', data.access_token);
         window.location.href = 'principal.html';
      } else {
         alert('Login inválido');
      }
   }


</script>

</body>
</html>
